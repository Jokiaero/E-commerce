<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Checkout &amp; Pembayaran - RasaLokal</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for custom brand colors -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF5400',
              orangeLight: '#FFF5F0',
              dark: '#1F2937',
              gray: '#6B7280',
              border: '#E5E7EB',
              bg: '#F9FAFB'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    /* Remove tap highlight on mobile iOS */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide default scrollbars for smooth app appearance */
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen font-sans antialiased select-none">
<!-- BEGIN: MobileFrameContainer -->
<!-- Container replicating standard iPhone screen dimensions (390px x 844px) -->
<main class="w-[390px] h-[844px] bg-white flex flex-col justify-between relative shadow-2xl rounded-[44px] overflow-hidden border-[8px] border-black">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center text-xs font-semibold text-black shrink-0 select-none z-20 bg-white">
<span>9:47</span>
<div class="flex items-center space-x-1.5">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.54-.5 2.97-1.35 4.13L12 19.53l-5.65-3.4C5.5 14.97 5 13.54 5 12c0-3.87 3.13-7 7-7z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 3.32c3.41 0 6.54 1.25 8.96 3.32L12 19.34 3.04 10.64C5.46 8.57 8.59 7.32 12 7.32z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
<div class="h-full w-3/4 bg-black rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav aria-label="Navigasi Atas" class="flex items-center px-4 py-3 bg-white shrink-0 z-10">
<button aria-label="Kembali" class="p-1 -ml-1 text-gray-800 hover:text-black focus:outline-none" type="button">
<!-- Back Arrow Icon -->
<svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="flex-1 text-center font-bold text-lg text-gray-900 pr-5">Checkout</h1>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: ScrollableContent -->
<section class="flex-1 overflow-y-auto px-4 pb-4 space-y-4" data-purpose="checkout-content">
<!-- BEGIN: AlamatPengiriman -->
<section aria-labelledby="alamat-title" class="space-y-2">
<h2 class="text-sm font-semibold text-gray-900" id="alamat-title">Alamat Pengiriman</h2>
<!-- Address Card -->
<div class="bg-white border border-gray-100 rounded-xl p-3.5 shadow-sm flex items-start justify-between cursor-pointer hover:border-gray-200 transition">
<div class="flex items-start space-x-3">
<!-- Pin Location Icon -->
<div class="mt-0.5 text-brand-orange shrink-0">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"></path>
</svg>
</div>
<!-- Address Details -->
<div class="text-xs">
<div class="font-bold text-gray-900 text-sm">Afina Meutya Putri</div>
<div class="text-gray-500 mt-0.5 leading-snug">Jl. Sudirman No. 123, Palembang</div>
<div class="text-gray-500 leading-snug">0812 3456 7890</div>
</div>
</div>
<!-- Chevron Right Icon -->
<div class="text-gray-400 self-center">
<svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Add New Address Button -->
<button class="flex items-center text-xs font-medium text-blue-600 hover:text-blue-700 py-1 transition space-x-1.5 focus:outline-none" type="button">
<svg class="w-4 h-4 stroke-current stroke-2 fill-none text-blue-500" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-blue-600 font-medium">Tambah Alamat Baru</span>
</button>
</section>
<!-- END: AlamatPengiriman -->
<!-- BEGIN: MetodePengiriman -->
<section aria-labelledby="shipping-title" class="space-y-2 pt-1">
<h2 class="text-sm font-semibold text-gray-900" id="shipping-title">Metode Pengiriman</h2>
<div class="space-y-2">
<!-- Option 1: Reguler (Selected) -->
<label class="flex items-center justify-between p-3.5 bg-white border border-brand-orange/40 rounded-xl cursor-pointer hover:bg-orange-50/20 transition">
<div class="flex items-center space-x-3">
<!-- Selected Custom Radio Button -->
<div class="w-4 h-4 rounded-full border-[1.5px] border-brand-orange flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-brand-orange"></div>
</div>
<span class="text-xs font-semibold text-gray-800">Reguler (1–2 hari)</span>
</div>
<span class="text-xs text-gray-500">Rp 10.000</span>
</label>
<!-- Option 2: Instant (Unselected) -->
<label class="flex items-center justify-between p-3.5 bg-white border border-gray-100 rounded-xl cursor-pointer hover:bg-gray-50 transition">
<div class="flex items-center space-x-3">
<!-- Unselected Custom Radio Button -->
<div class="w-4 h-4 rounded-full border-[1.5px] border-gray-300"></div>
<span class="text-xs text-gray-700">Instant (hari ini)</span>
</div>
<span class="text-xs text-gray-500">Rp 15.000</span>
</label>
</div>
</section>
<!-- END: MetodePengiriman -->
<!-- BEGIN: MetodePembayaran -->
<section aria-labelledby="payment-title" class="space-y-2 pt-1">
<h2 class="text-sm font-semibold text-gray-900" id="payment-title">Metode Pembayaran</h2>
<div class="space-y-2">
<!-- Option 1: Transfer Bank -->
<label class="flex items-center p-3.5 bg-white border border-gray-100 rounded-xl cursor-pointer hover:bg-gray-50 transition space-x-3">
<div class="w-4 h-4 rounded-full border-[1.5px] border-gray-300"></div>
<span class="text-xs text-gray-700">Transfer Bank</span>
</label>
<!-- Option 2: E-Wallet (Selected) -->
<label class="flex items-center p-3.5 bg-white border border-brand-orange/40 rounded-xl cursor-pointer hover:bg-orange-50/20 transition space-x-3">
<div class="w-4 h-4 rounded-full border-[1.5px] border-brand-orange flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-brand-orange"></div>
</div>
<span class="text-xs font-semibold text-gray-800">E-Wallet (OVO, DANA, GoPay)</span>
</label>
<!-- Option 3: COD -->
<label class="flex items-center p-3.5 bg-white border border-gray-100 rounded-xl cursor-pointer hover:bg-gray-50 transition space-x-3">
<div class="w-4 h-4 rounded-full border-[1.5px] border-gray-300"></div>
<span class="text-xs text-gray-700">COD (Bayar di Tempat)</span>
</label>
</div>
</section>
<!-- END: MetodePembayaran -->
<!-- BEGIN: RincianPembayaran -->
<section aria-label="Rincian Pembayaran" class="pt-2 text-xs text-gray-600 space-y-1.5">
<div class="flex justify-between items-center">
<span>Subtotal</span>
<span class="text-gray-900">Rp 72.000</span>
</div>
<div class="flex justify-between items-center">
<span>Ongkir</span>
<span class="text-gray-900">Rp 10.000</span>
</div>
<div class="pt-2">
<div class="border-t border-gray-100 pt-2 flex justify-between items-center">
<span class="font-bold text-gray-900 text-xs">Total Pembayaran</span>
<span class="font-bold text-brand-orange text-sm">Rp 82.000</span>
</div>
</div>
</section>
<!-- END: RincianPembayaran -->
</section>
<!-- END: ScrollableContent -->
<!-- BEGIN: BottomStickyAction -->
<footer class="p-4 bg-white border-t border-gray-50 flex flex-col items-center shrink-0">
<!-- Pay Now Button -->
<button class="w-full bg-[#FF5400] hover:bg-[#e04a00] active:scale-[0.99] transition text-white font-semibold py-3.5 rounded-full text-sm shadow-md shadow-orange-500/20" type="button">
        Bayar Sekarang
      </button>
<!-- iOS Home Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-gray-300 rounded-full mt-3.5 mb-1"></div>
</footer>
<!-- END: BottomStickyAction -->
</main>
<!-- END: MobileFrameContainer -->
</body></html>
